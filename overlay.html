<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta name="color-scheme" content="dark">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: transparent; width: 100%; height: 100%; }
  body { font-family: Inter, "Segoe UI", sans-serif; color: #f7f3ff; user-select: none; }
  body.armed, body.armed * { cursor: none !important; }
  canvas { position: fixed; inset: 0; display: block; }

  .armory-backdrop {
    position: fixed;
    left: var(--display-x, 0px);
    top: var(--display-y, 0px);
    width: var(--display-width, 100vw);
    height: var(--display-height, 100vh);
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(5, 6, 8, .64);
    container-type: inline-size;
  }
  .armory-backdrop[hidden] { display: none; }
  .armory {
    width: min(840px, calc(100% - 48px));
    max-height: calc(100% - 48px);
    overflow: auto;
    padding: 24px;
    border: 1px solid #303238;
    border-radius: 18px;
    background: #121317;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .42);
  }
  .armory-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .eyebrow { margin: 0 0 7px; color: #858993; font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(27px, 3.5vw, 34px); font-weight: 650; line-height: 1.1; letter-spacing: -.025em; }
  .subtitle { margin: 8px 0 0; color: #91959f; font-size: 13px; }
  .close-button {
    width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid #34363d; border-radius: 9px;
    color: #b3b6bd; background: #1b1c21; cursor: pointer; font-size: 19px;
  }
  .close-button:hover { color: #fff; border-color: #555861; }
  .section-title { margin: 22px 0 10px; color: #a8abb3; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
  .weapon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .weapon-card {
    min-height: 126px; padding: 15px; border: 1px solid #2d2f35; border-radius: 12px;
    color: #e6e7ea; text-align: left; background: #18191e; cursor: pointer; transition: border-color .14s ease, background .14s ease;
  }
  .weapon-card:hover { border-color: #50535b; background: #1b1d22; }
  .weapon-card.selected { border-color: #898d96; background: #202228; }
  .weapon-icon { display: block; margin-bottom: 13px; color: #c6c8ce; font-size: 24px; line-height: 1; }
  .weapon-name { display: block; font-size: 14px; font-weight: 650; }
  .weapon-note { display: block; margin-top: 5px; color: #858993; font-size: 11px; line-height: 1.35; }
  .color-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .color-swatch {
    width: 30px; height: 30px; border: 2px solid #121317; border-radius: 50%;
    background: var(--swatch); cursor: pointer; box-shadow: 0 0 0 1px #3a3c43; transition: border-color .12s ease;
  }
  .color-swatch:hover { border-color: rgba(255,255,255,.7); }
  .color-swatch.selected { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
  .custom-color { display: flex; align-items: center; gap: 8px; margin-left: 6px; color: #8e929b; font-size: 12px; }
  .custom-color input { width: 36px; height: 30px; padding: 2px; border: 1px solid #3a3c43; border-radius: 7px; background: transparent; cursor: pointer; }
  .armory-footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 23px; padding-top: 17px; border-top: 1px solid #292b31; }
  .hint { color: #787c85; font-size: 11px; }
  .equip-button {
    min-width: 150px; padding: 11px 18px; border: 1px solid #f1f2f4; border-radius: 9px; color: #111216; background: #f1f2f4;
    cursor: pointer; font-size: 13px; font-weight: 700;
  }
  .equip-button:hover { background: #fff; }
  .ownership { margin: 14px 0 -4px; color: #676b74; font-size: 10px; letter-spacing: .035em; text-align: center; }
  @media (max-width: 720px) { .weapon-grid { grid-template-columns: repeat(2, 1fr); } .armory { padding: 22px; } }
  @container (max-width: 720px) { .weapon-grid { grid-template-columns: repeat(2, 1fr); } .armory { padding: 22px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="armoryBackdrop" class="armory-backdrop" hidden>
  <main class="armory" role="dialog" aria-modal="true" aria-labelledby="armoryTitle">
    <header class="armory-header">
      <div>
        <p class="eyebrow">WhipWhip</p>
        <h1 id="armoryTitle">Choose a weapon</h1>
        <p class="subtitle">Select a style and color.</p>
      </div>
      <button id="closeArmory" class="close-button" aria-label="Close armory">&times;</button>
    </header>

    <h2 class="section-title">Weapon</h2>
    <div class="weapon-grid" role="listbox" aria-label="Weapon style">
      <button class="weapon-card" data-weapon="classic" role="option"><span class="weapon-icon">⌁</span><span class="weapon-name">Classic Whip</span><span class="weapon-note">Balanced leather snap with the original feel.</span></button>
      <button class="weapon-card" data-weapon="chain" role="option"><span class="weapon-icon">⛓</span><span class="weapon-name">Chain Flail</span><span class="weapon-note">Heavy metal links and a dangerous spiked tip.</span></button>
      <button class="weapon-card" data-weapon="plasma" role="option"><span class="weapon-icon">ϟ</span><span class="weapon-name">Plasma Lash</span><span class="weapon-note">Light, fast and wrapped in a neon energy glow.</span></button>
      <button class="weapon-card" data-weapon="fire" role="option"><span class="weapon-icon">♨</span><span class="weapon-name">Firebrand</span><span class="weapon-note">A hot trailing lash that throws glowing embers.</span></button>
      <button class="weapon-card" data-weapon="bullwhip" role="option"><span class="weapon-icon">∿</span><span class="weapon-name">Bullwhip</span><span class="weapon-note">Long, tapered leather built for precise cracks.</span></button>
      <button class="weapon-card" data-weapon="ropeDart" role="option"><span class="weapon-icon">◆</span><span class="weapon-name">Rope Dart</span><span class="weapon-note">Flexible cord with a weighted diamond point.</span></button>
      <button class="weapon-card" data-weapon="cable" role="option"><span class="weapon-icon">⊙</span><span class="weapon-name">Steel Cable</span><span class="weapon-note">Short, controlled and deliberately industrial.</span></button>
      <button class="weapon-card" data-weapon="ribbon" role="option"><span class="weapon-icon">≋</span><span class="weapon-name">Ribbon Blade</span><span class="weapon-note">A broad metallic ribbon with flowing movement.</span></button>
    </div>

    <h2 class="section-title">Color</h2>
    <div id="colorRow" class="color-row">
      <button class="color-swatch" data-color="#52606d" style="--swatch:#52606d" aria-label="Slate"></button>
      <button class="color-swatch" data-color="#7a3e48" style="--swatch:#7a3e48" aria-label="Oxblood"></button>
      <button class="color-swatch" data-color="#8a6747" style="--swatch:#8a6747" aria-label="Saddle"></button>
      <button class="color-swatch" data-color="#9a8248" style="--swatch:#9a8248" aria-label="Brass"></button>
      <button class="color-swatch" data-color="#3f6252" style="--swatch:#3f6252" aria-label="Forest"></button>
      <button class="color-swatch" data-color="#45647a" style="--swatch:#45647a" aria-label="Steel blue"></button>
      <button class="color-swatch" data-color="#66516f" style="--swatch:#66516f" aria-label="Aubergine"></button>
      <label class="custom-color">Custom <input id="customColor" type="color" value="#52606d"></label>
    </div>

    <footer class="armory-footer">
      <span class="hint">Move fast to crack · Left-click to drop · Right-click to dismiss</span>
      <button id="equipButton" class="equip-button">Equip</button>
    </footer>
    <p class="ownership">© 2026 AMIRSRAD · amirsrad.ir · All rights reserved</p>
  </main>
</div>
<script>

// ══════════════════════════════════════════════════════════════════════════════
//  PHYSICS SETTINGS — TWEAK EVERYTHING HERE
// ══════════════════════════════════════════════════════════════════════════════
const P = {
  // Rope structure
  segments:       28,     // number of chain links
  segmentLength:  25,     // base length of each link (px)
  taper:          0.6,   // tip segment is this fraction of base length

  // Physics
  gravity:        1.2,   // normal gravity
  dropGravity:    0.95,    // gravity when dropping/despawning
  damping:        0.96,  // velocity retention per frame (1 = no loss)
  constraintIters:20,    // higher = stiffer chain
  maxStretchRatio: 1.2, // hard cap for per-link stretch during fast whips

  // Dynamic handle aim (target angle + restoring spring, not static lock)
  baseTargetAngle: -1.12, // radians, default "up-right" resting direction
  handleAimByMouseX: 0.4, // horizontal mouse movement influence on target angle
  handleAimByMouseY: 0.2, // vertical mouse movement influence on target angle
  handleAimClamp:    2.0, // max radians target can deviate from base angle
  handleSpring:      0.7, // restoring force to target angle
  handleAngularDamping: 0.078, // angular velocity damping
  basePoseSegments: 2,    // how many early segments are strongly guided
  basePoseStiffStart: 0.9, // stiffness near handle
  basePoseStiffEnd:   0.8, // stiffness near end of guided region

  // Elastic bend limits by chain position (handle stiff, tip floppy)
  handleMaxBendDeg: 16,   // max angle between links near handle
  tipMaxBendDeg:   130,   // max angle between links near tip
  bendRigidityStart: 0.8, // correction strength near handle
  bendRigidityEnd:   0.12, // correction strength near tip

  // Screen-edge slap
  wallBounce:      0.42,   // velocity retained after wall hit
  wallFriction:    0.86,   // tangential damping on wall hit

  // Crack detection
  crackSpeed:     340,     // tip velocity threshold to trigger crack
  crackCooldownMs:200,   // min ms between cracks
  firstCrackGraceMs: 350, // no crack (macro) until this long after spawn

  // Visuals
  lineWidthHandle: 7,      // rope thickness near handle
  lineWidthTip:    5,      // rope thickness near tip
  outlineWidth:   3,      // white halo on each side of the stroke (approx px)
  handleExtraWidth: 5,    // added core + outline thickness on first handleThickSegments links only
  handleThickSegments: 2, // how many links from the handle get handleExtraWidth
  bgAlpha:        0.011,  // barely-visible bg so window captures mouse events

  // Initial arc shape
  arcWidth:       260,    // how far right the arc extends from mouse
  arcHeight:      185,    // how high the arc goes above mouse
};

const DEFAULT_PHYSICS = { ...P };
const WEAPONS = {
  classic: {
    label: 'Classic Whip',
    physics: {},
  },
  chain: {
    label: 'Chain Flail',
    physics: {
      segments: 25, segmentLength: 24, taper: 0.82, gravity: 1.55,
      dropGravity: 1.25, damping: 0.975, constraintIters: 24,
      handleMaxBendDeg: 24, tipMaxBendDeg: 105, crackSpeed: 300,
      lineWidthHandle: 6, lineWidthTip: 4, handleExtraWidth: 2,
    },
  },
  plasma: {
    label: 'Plasma Lash',
    physics: {
      segments: 34, segmentLength: 21, taper: 0.45, gravity: 0.72,
      damping: 0.94, constraintIters: 16, handleMaxBendDeg: 20,
      tipMaxBendDeg: 145, crackSpeed: 285, lineWidthHandle: 8,
      lineWidthTip: 3, outlineWidth: 5, handleExtraWidth: 2,
    },
  },
  fire: {
    label: 'Firebrand',
    physics: {
      segments: 30, segmentLength: 23, taper: 0.52, gravity: 1.0,
      damping: 0.955, constraintIters: 18, handleMaxBendDeg: 18,
      tipMaxBendDeg: 140, crackSpeed: 310, lineWidthHandle: 9,
      lineWidthTip: 4, outlineWidth: 4, handleExtraWidth: 3,
    },
  },
  bullwhip: {
    label: 'Bullwhip',
    physics: {
      segments: 38, segmentLength: 20, taper: 0.28, gravity: 1.05,
      damping: 0.962, constraintIters: 25, maxStretchRatio: 1.08,
      handleMaxBendDeg: 12, tipMaxBendDeg: 155, crackSpeed: 315,
      lineWidthHandle: 10, lineWidthTip: 2.5, outlineWidth: 2,
      handleExtraWidth: 4, handleThickSegments: 4, arcWidth: 300,
    },
  },
  ropeDart: {
    label: 'Rope Dart',
    physics: {
      segments: 32, segmentLength: 22, taper: 0.82, gravity: 1.15,
      damping: 0.972, constraintIters: 24,
      handleMaxBendDeg: 26, tipMaxBendDeg: 165, crackSpeed: 300,
      lineWidthHandle: 5, lineWidthTip: 3, outlineWidth: 2,
      handleExtraWidth: 1, arcWidth: 275,
    },
  },
  cable: {
    label: 'Steel Cable',
    physics: {
      segments: 24, segmentLength: 22, taper: 0.9, gravity: 1.35,
      damping: 0.978, constraintIters: 28,
      maxStretchRatio: 1.06, handleMaxBendDeg: 9, tipMaxBendDeg: 82,
      crackSpeed: 325, lineWidthHandle: 8, lineWidthTip: 6,
      outlineWidth: 2, handleExtraWidth: 2, arcWidth: 225,
    },
  },
  ribbon: {
    label: 'Ribbon Blade',
    physics: {
      segments: 34, segmentLength: 22, taper: 0.5, gravity: 0.82,
      damping: 0.95, constraintIters: 19,
      handleMaxBendDeg: 18, tipMaxBendDeg: 168, crackSpeed: 292,
      lineWidthHandle: 14, lineWidthTip: 4, outlineWidth: 1,
      handleExtraWidth: 1, arcWidth: 290, arcHeight: 210,
    },
  },
};

// ══════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const armoryBackdrop = document.getElementById('armoryBackdrop');
const weaponCards = [...document.querySelectorAll('.weapon-card')];
const colorSwatches = [...document.querySelectorAll('.color-swatch')];
const customColor = document.getElementById('customColor');
const equipButton = document.getElementById('equipButton');
const closeArmoryButton = document.getElementById('closeArmory');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
let prevMouseX = 0, prevMouseY = 0;
let whip = null;
let dropping = false;
let lastCrackTime = 0;
let whipSpawnTime = 0;
let handleAngle = P.baseTargetAngle;
let handleAngVel = 0;
let configuring = false;
let particles = [];

const DEFAULT_COLOR = '#52606d';
const LEGACY_DEFAULT_COLOR = '#ff3b5c';
const PALETTE_VERSION = 'professional-v1';
let activeWeapon = 'classic';
let activeColor = DEFAULT_COLOR;

const WHIP_CRACK_SOUNDS = ['sounds/A.mp3', 'sounds/B.mp3', 'sounds/C.mp3', 'sounds/D.mp3', 'sounds/E.mp3'];

document.addEventListener('mousemove', event => { mouseX = event.clientX; mouseY = event.clientY; });
document.addEventListener('mousedown', event => {
  if (event.button !== 0) return;
  if (configuring || event.target.closest('.armory')) return;
  if (whip && !dropping) dropping = true;
});
document.addEventListener('contextmenu', event => {
  event.preventDefault();
  if (!configuring && whip) dismissWhip();
});

function restoreSavedSelection() {
  const storedWeapon = localStorage.getItem('whipwhip.weapon');
  let storedColor = localStorage.getItem('whipwhip.color');
  if (localStorage.getItem('whipwhip.palette') !== PALETTE_VERSION) {
    if (!storedColor || storedColor.toLowerCase() === LEGACY_DEFAULT_COLOR) storedColor = DEFAULT_COLOR;
    localStorage.setItem('whipwhip.palette', PALETTE_VERSION);
    localStorage.setItem('whipwhip.color', storedColor || DEFAULT_COLOR);
  }
  activeWeapon = Object.hasOwn(WEAPONS, storedWeapon) ? storedWeapon : 'classic';
  activeColor = /^#[0-9a-f]{6}$/i.test(storedColor || '') ? storedColor : DEFAULT_COLOR;
}

function applyDesktopLayout(layout) {
  const display = layout?.activeDisplay;
  if (!display) return;
  armoryBackdrop.style.setProperty('--display-x', `${display.x}px`);
  armoryBackdrop.style.setProperty('--display-y', `${display.y}px`);
  armoryBackdrop.style.setProperty('--display-width', `${display.width}px`);
  armoryBackdrop.style.setProperty('--display-height', `${display.height}px`);
}

function applyWeaponSettings() {
  Object.assign(P, DEFAULT_PHYSICS, WEAPONS[activeWeapon].physics);
  document.documentElement.style.setProperty('--accent', activeColor);
}

function refreshArmorySelection() {
  weaponCards.forEach(card => {
    const selected = card.dataset.weapon === activeWeapon;
    card.classList.toggle('selected', selected);
    card.setAttribute('aria-selected', String(selected));
  });
  colorSwatches.forEach(swatch => {
    swatch.classList.toggle('selected', swatch.dataset.color.toLowerCase() === activeColor.toLowerCase());
  });
  customColor.value = activeColor;
  document.documentElement.style.setProperty('--accent', activeColor);
}

function openArmory(layout) {
  applyDesktopLayout(layout);
  restoreSavedSelection();
  whip = null;
  particles = [];
  dropping = false;
  configuring = true;
  document.body.classList.remove('armed');
  armoryBackdrop.hidden = false;
  refreshArmorySelection();
  window.bridge.setInteractionMode(true);
}

function closeArmory() {
  configuring = false;
  armoryBackdrop.hidden = true;
  window.bridge.hideOverlay();
  window.bridge.setInteractionMode(false);
}

function beginWhip() {
  applyWeaponSettings();
  particles = [];
  configuring = false;
  armoryBackdrop.hidden = true;
  document.body.classList.add('armed');
  whip = spawnWhip(mouseX || W / 2, mouseY || H / 2);
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  handleAngle = P.baseTargetAngle;
  handleAngVel = 0;
  window.bridge.setInteractionMode(false);
}

function dismissWhip() {
  whip = null;
  particles = [];
  dropping = false;
  configuring = false;
  armoryBackdrop.hidden = true;
  document.body.classList.remove('armed');
  window.bridge.hideOverlay();
}

weaponCards.forEach(card => card.addEventListener('click', () => {
  activeWeapon = card.dataset.weapon;
  refreshArmorySelection();
}));

colorSwatches.forEach(swatch => swatch.addEventListener('click', () => {
  activeColor = swatch.dataset.color;
  refreshArmorySelection();
}));

customColor.addEventListener('input', () => {
  activeColor = customColor.value;
  refreshArmorySelection();
});

closeArmoryButton.addEventListener('click', closeArmory);
equipButton.addEventListener('click', () => {
  localStorage.setItem('whipwhip.weapon', activeWeapon);
  localStorage.setItem('whipwhip.color', activeColor);
  beginWhip();
});

restoreSavedSelection();
applyWeaponSettings();

// ── Whip creation ───────────────────────────────────────────────────────────
function spawnWhip(mx, my) {
  dropping = false;
  lastCrackTime = 0;
  whipSpawnTime = Date.now();
  const pts = [];
  for (let i = 0; i < P.segments; i++) {
    const t = i / (P.segments - 1);
    // Nice upward arc from handle (mouse) to tip
    const x = mx + t * P.arcWidth;
    const y = my - Math.sin(t * Math.PI * 0.75) * P.arcHeight;
    pts.push({ x, y, px: x, py: y });
  }
  return pts;
}

function segLen(i) {
  const t = i / (P.segments - 1);
  return P.segmentLength * (1 - t * (1 - P.taper));
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

/** Point on Catmull–Rom spline (extrapolated ends) for index i in `pts`. */
function catmullPoint(pts, i) {
  const n = pts.length;
  if (n === 0) return { x: 0, y: 0 };
  if (i < 0) {
    if (n >= 2) {
      return { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y };
    }
    return { x: pts[0].x, y: pts[0].y };
  }
  if (i >= n) {
    if (n >= 2) {
      const a = pts[n - 2], b = pts[n - 1];
      return { x: 2 * b.x - a.x, y: 2 * b.y - a.y };
    }
    return { x: pts[n - 1].x, y: pts[n - 1].y };
  }
  return pts[i];
}

/**
 * Cubic Bézier from p1→p2 matching uniform Catmull–Rom through p0,p1,p2,p3.
 * Control points: C1 = p1 + (p2-p0)/6, C2 = p2 - (p3-p1)/6.
 */
function whipSegmentBezier(pts, i) {
  const p0 = catmullPoint(pts, i - 1);
  const p1 = pts[i];
  const p2 = pts[i + 1];
  const p3 = catmullPoint(pts, i + 2);
  return {
    cp1x: p1.x + (p2.x - p0.x) / 6,
    cp1y: p1.y + (p2.y - p0.y) / 6,
    cp2x: p2.x - (p3.x - p1.x) / 6,
    cp2y: p2.y - (p3.y - p1.y) / 6,
    x2: p2.x,
    y2: p2.y,
  };
}
const wrapPi = a => {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
};

function playCrackSound() {
  if (!WHIP_CRACK_SOUNDS.length) return;
  const src = WHIP_CRACK_SOUNDS[Math.floor(Math.random() * WHIP_CRACK_SOUNDS.length)];
  const a = new Audio(src);
  a.play().catch(() => {});
}

function updateHandleAim() {
  if (dropping) return;
  const mvx = mouseX - prevMouseX;
  const mvy = mouseY - prevMouseY;
  const delta = clamp(
    mvx * P.handleAimByMouseX + mvy * P.handleAimByMouseY,
    -P.handleAimClamp,
    P.handleAimClamp
  );
  const target = P.baseTargetAngle + delta;
  const err = wrapPi(target - handleAngle);
  handleAngVel += err * P.handleSpring;
  handleAngVel *= P.handleAngularDamping;
  handleAngle = wrapPi(handleAngle + handleAngVel);
}

function applyBasePose() {
  if (!whip || dropping) return;
  const dx = Math.cos(handleAngle);
  const dy = Math.sin(handleAngle);
  const guided = Math.min(P.basePoseSegments, whip.length - 1);
  for (let i = 1; i <= guided; i++) {
    const t = (i - 1) / Math.max(guided - 1, 1);
    const stiff = lerp(P.basePoseStiffStart, P.basePoseStiffEnd, t);
    const prev = whip[i - 1];
    const p = whip[i];
    const targetLen = segLen(i - 1);
    const tx = prev.x + dx * targetLen;
    const ty = prev.y + dy * targetLen;
    p.x = lerp(p.x, tx, stiff);
    p.y = lerp(p.y, ty, stiff);
  }
}

function applyBendLimits() {
  if (!whip || whip.length < 3) return;
  for (let i = 1; i < whip.length - 1; i++) {
    const a = whip[i - 1];
    const b = whip[i];
    const c = whip[i + 1];

    const v1x = a.x - b.x;
    const v1y = a.y - b.y;
    const v2x = c.x - b.x;
    const v2y = c.y - b.y;
    const l1 = Math.hypot(v1x, v1y) || 0.0001;
    const l2 = Math.hypot(v2x, v2y) || 0.0001;
    const n1x = v1x / l1, n1y = v1y / l1;
    const n2x = v2x / l2, n2y = v2y / l2;

    const dot = clamp(n1x * n2x + n1y * n2y, -1, 1);
    const angle = Math.acos(dot);
    const t = i / (whip.length - 2);
    const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * Math.PI / 180;
    const bend = Math.PI - angle; // bend away from a straight line
    if (bend <= maxBend) continue;

    // Clamp to max bend while preserving side/sign of the bend.
    const cross = n1x * n2y - n1y * n2x;
    const sign = cross >= 0 ? 1 : -1;
    const targetAngle = Math.PI - maxBend;
    const targetA = Math.atan2(n1y, n1x) + sign * targetAngle;
    const tx = b.x + Math.cos(targetA) * l2;
    const ty = b.y + Math.sin(targetA) * l2;
    const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);

    c.x = lerp(c.x, tx, rigidity);
    c.y = lerp(c.y, ty, rigidity);
  }
}

function capSegmentStretch() {
  if (!whip || whip.length < 2) return;
  for (let i = 0; i < whip.length - 1; i++) {
    const a = whip[i];
    const b = whip[i + 1];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const maxLen = segLen(i) * P.maxStretchRatio;
    if (dist <= maxLen) continue;
    const k = maxLen / dist;
    b.x = a.x + dx * k;
    b.y = a.y + dy * k;
  }
}

function applyWallCollisions() {
  if (!whip || dropping) return; // disable collisions while dropping
  const start = 1; // keep pinned handle untouched
  for (let i = start; i < whip.length; i++) {
    const p = whip[i];
    let vx = p.x - p.px;
    let vy = p.y - p.py;
    let hit = false;

    if (p.x < 0) {
      p.x = 0;
      if (vx < 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    } else if (p.x > W) {
      p.x = W;
      if (vx > 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    }

    if (p.y < 0) {
      p.y = 0;
      if (vy < 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    } else if (p.y > H) {
      p.y = H;
      if (vy > 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    }

    if (hit) {
      p.px = p.x - vx;
      p.py = p.y - vy;
    }
  }
}

// ── Physics step ────────────────────────────────────────────────────────────
function update() {
  if (!whip) return;

  const g = dropping ? P.dropGravity : P.gravity;
  updateHandleAim();

  // Verlet integration
  const start = dropping ? 0 : 1; // if dropping, handle is free too
  for (let i = start; i < whip.length; i++) {
    const p = whip[i];
    const vx = (p.x - p.px) * P.damping;
    const vy = (p.y - p.py) * P.damping;
    p.px = p.x;
    p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }

  // Pin handle to mouse
  if (!dropping) {
    whip[0].x = mouseX;
    whip[0].y = mouseY;
    whip[0].px = mouseX;
    whip[0].py = mouseY;
  }

  // Prevent rubber-band stretching spikes before constraints.
  capSegmentStretch();
  applyWallCollisions();

  // Keep early whip segments posed upward from handle.
  applyBasePose();

  // Distance constraints (multiple iterations for stiffness)
  for (let iter = 0; iter < P.constraintIters; iter++) {
    for (let i = 0; i < whip.length - 1; i++) {
      const a = whip[i], b = whip[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const target = segLen(i);
      const diff = (dist - target) / dist * 0.5;
      const ox = dx * diff, oy = dy * diff;
      if (i === 0 && !dropping) {
        // Handle is pinned – push only the next point
        b.x -= ox * 2;
        b.y -= oy * 2;
      } else {
        a.x += ox; a.y += oy;
        b.x -= ox; b.y -= oy;
      }
    }
    // Clamp bend angle per joint; near handle = stiffer, near tip = floppier.
    applyBendLimits();
    if (!dropping) applyBasePose();
    capSegmentStretch();
    applyWallCollisions();
  }

  // Tip velocity for crack detection
  const tip = whip[whip.length - 1];
  const tipVel = Math.hypot(tip.x - tip.px, tip.y - tip.py);

  if (!dropping && tipVel > P.crackSpeed) {
    const now = Date.now();
    if (now - whipSpawnTime >= P.firstCrackGraceMs && now - lastCrackTime > P.crackCooldownMs) {
      lastCrackTime = now;
      playCrackSound();
      window.bridge.whipCrack();
    }
  }

  // If dropping, check if everything fell off screen
  if (dropping && whip.every(p => p.y > H + 60)) {
    whip = null;
    dropping = false;
    particles = [];
    document.body.classList.remove('armed');
    window.bridge.hideOverlay();
  }
  prevMouseX = mouseX;
  prevMouseY = mouseY;
}

// ── Rendering ───────────────────────────────────────────────────────────────
function traceWhipPath() {
  if (!whip || whip.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(whip[0].x, whip[0].y);
  for (let i = 0; i < whip.length - 1; i++) {
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
  }
}

function strokeWhip(color, width, shadowBlur = 0, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = shadowBlur;
  traceWhipPath();
  ctx.stroke();
  ctx.restore();
}

function drawClassicWhip() {
  strokeWhip('#ffffff', P.lineWidthTip + P.outlineWidth * 2, 0, .94);
  ctx.save();
  ctx.strokeStyle = activeColor;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < whip.length - 1; i++) {
    const t = i / Math.max(1, whip.length - 2);
    const extra = i < P.handleThickSegments ? P.handleExtraWidth : 0;
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t) + extra;
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
    ctx.beginPath();
    ctx.moveTo(whip[i].x, whip[i].y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawChainFlail() {
  strokeWhip('rgba(0,0,0,.75)', 8);
  strokeWhip(activeColor, 3, 8, .9);
  ctx.save();
  ctx.strokeStyle = '#f5f2ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = activeColor;
  ctx.shadowBlur = 7;
  for (let i = 1; i < whip.length - 1; i++) {
    const p = whip[i];
    const prev = whip[i - 1];
    const angle = Math.atan2(p.y - prev.y, p.x - prev.x) + (i % 2 ? 0 : Math.PI / 2);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 9, 5, angle, 0, Math.PI * 2);
    ctx.stroke();
  }
  const tip = whip[whip.length - 1];
  ctx.fillStyle = '#17131e';
  ctx.strokeStyle = activeColor;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(tip.x + Math.cos(a) * 12, tip.y + Math.sin(a) * 12);
    ctx.lineTo(tip.x + Math.cos(a) * 23, tip.y + Math.sin(a) * 23);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlasmaLash() {
  strokeWhip(activeColor, 26, 28, .14);
  strokeWhip(activeColor, 13, 22, .4);
  strokeWhip(activeColor, 7, 14, .95);
  strokeWhip('#ffffff', 2.5, 8, .95);
}

function drawBullwhip() {
  strokeWhip('rgba(7,8,10,.92)', P.lineWidthHandle + 6, 0, .9);
  ctx.save();
  ctx.strokeStyle = activeColor;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < whip.length - 1; i++) {
    const t = i / Math.max(1, whip.length - 2);
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t);
    const segment = whipSegmentBezier(whip, i);
    ctx.beginPath();
    ctx.moveTo(whip[i].x, whip[i].y);
    ctx.bezierCurveTo(segment.cp1x, segment.cp1y, segment.cp2x, segment.cp2y, segment.x2, segment.y2);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(235,231,220,.62)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < Math.min(5, whip.length - 1); i++) {
    const a = whip[i], b = whip[i + 1];
    const angle = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
    const radius = lerp(7, 4, i / 5);
    ctx.beginPath();
    ctx.moveTo(a.x - Math.cos(angle) * radius, a.y - Math.sin(angle) * radius);
    ctx.lineTo(a.x + Math.cos(angle) * radius, a.y + Math.sin(angle) * radius);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRopeDart() {
  strokeWhip('rgba(8,9,11,.9)', 7);
  strokeWhip(activeColor, 3.5, 0, .96);
  strokeWhip('rgba(238,239,236,.5)', 1, 0, .8);
  const tip = whip[whip.length - 1];
  const previous = whip[whip.length - 2];
  const angle = Math.atan2(tip.y - previous.y, tip.x - previous.x);
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(angle);
  ctx.fillStyle = '#d7d9d8';
  ctx.strokeStyle = activeColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(25, 0);
  ctx.lineTo(-4, -11);
  ctx.lineTo(-13, 0);
  ctx.lineTo(-4, 11);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawSteelCable() {
  strokeWhip('rgba(5,6,7,.94)', 13);
  strokeWhip('#747b80', 8, 0, .98);
  strokeWhip(activeColor, 3, 3, .9);
  ctx.save();
  for (let i = 3; i < whip.length; i += 4) {
    const p = whip[i];
    ctx.fillStyle = '#202429';
    ctx.strokeStyle = '#a7adb1';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function drawRibbonBlade() {
  strokeWhip('rgba(7,8,10,.7)', P.lineWidthHandle + 7, 0, .72);
  strokeWhip(activeColor, P.lineWidthHandle, 4, .92);
  strokeWhip('rgba(235,238,240,.72)', 2, 0, .88);
  const tip = whip[whip.length - 1];
  const previous = whip[whip.length - 2];
  const angle = Math.atan2(tip.y - previous.y, tip.x - previous.x);
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(angle);
  ctx.fillStyle = activeColor;
  ctx.strokeStyle = '#d8dbdd';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-7, -6);
  ctx.lineTo(-4, 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function updateFireParticles() {
  if (activeWeapon === 'fire' && whip && !dropping && !configuring) {
    const start = Math.max(2, whip.length - 10);
    for (let count = 0; count < 2; count++) {
      const p = whip[start + Math.floor(Math.random() * (whip.length - start))];
      particles.push({
        x: p.x, y: p.y, vx: (Math.random() - .5) * 2.8,
        vy: -1.2 - Math.random() * 2.2, life: 1, size: 2 + Math.random() * 4,
      });
    }
  }
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += .035;
    p.life -= .035;
    p.size *= .985;
  });
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 220) particles.splice(0, particles.length - 220);
}

function drawFirebrand() {
  const first = whip[0];
  const tip = whip[whip.length - 1];
  const flame = ctx.createLinearGradient(first.x, first.y, tip.x, tip.y);
  flame.addColorStop(0, activeColor);
  flame.addColorStop(.58, '#ff641f');
  flame.addColorStop(1, '#ffe96a');
  strokeWhip(activeColor, 24, 34, .16);
  strokeWhip('#ff4a16', 13, 24, .46);
  ctx.save();
  ctx.strokeStyle = flame;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#ff7a18';
  ctx.shadowBlur = 15;
  traceWhipPath();
  ctx.stroke();
  ctx.restore();

  ctx.save();
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.life > .5 ? '#ffe96a' : activeColor;
    ctx.shadowColor = '#ff641f';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Near-invisible fill so the window captures mouse events on Windows
  ctx.fillStyle = `rgba(0,0,0,${P.bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  if (!whip) return;

  if (activeWeapon === 'chain') drawChainFlail();
  else if (activeWeapon === 'plasma') drawPlasmaLash();
  else if (activeWeapon === 'fire') drawFirebrand();
  else if (activeWeapon === 'bullwhip') drawBullwhip();
  else if (activeWeapon === 'ropeDart') drawRopeDart();
  else if (activeWeapon === 'cable') drawSteelCable();
  else if (activeWeapon === 'ribbon') drawRibbonBlade();
  else drawClassicWhip();
}

// ── Main loop ───────────────────────────────────────────────────────────────
function loop() {
  update();
  updateFireParticles();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ── IPC from main process ───────────────────────────────────────────────────
window.bridge.onSpawnWhip(layout => {
  applyDesktopLayout(layout);
  restoreSavedSelection();
  beginWhip();
});

window.bridge.onOpenArmory(openArmory);
window.bridge.onDesktopLayout(applyDesktopLayout);

window.bridge.onDropWhip(() => {
  if (configuring) closeArmory();
  else if (whip && !dropping) dropping = true;
});

</script>
</body>
</html>
